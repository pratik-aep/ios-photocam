name: MIRASCapture
options:
  bundleIdPrefix: org.miras
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
targets:
  Geometry:
    type: framework
    platform: iOS
    sources: [Sources/Geometry]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_OPTIMIZATION_LEVEL: "-O"
  MIRASCapture:
    type: application
    platform: iOS
    sources: [Sources/MIRASCapture]
    dependencies:
      - target: Geometry
    info:
      path: Sources/MIRASCapture/Info.plist
      properties:
        CFBundleDisplayName: MIRAS Capture
        UILaunchScreen: {}
        NSCameraUsageDescription: Capture photographs to create a 360° heritage panorama.
        NSLocationWhenInUseUsageDescription: Orient your panorama to true north and remember its location.
        NSPhotoLibraryAddUsageDescription: Save the finished 360° panorama to your photo library.
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      GENERATE_INFOPLIST_FILE: NO
  MIRASCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/MIRASCaptureTests, Tests/GeometryTests]
    dependencies:
      - target: MIRASCapture
      - target: Geometry
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_OPTIMIZATION_LEVEL: "-O"
schemes:
  MIRASCapture:
    build:
      targets:
        MIRASCapture: all
        MIRASCaptureTests: [test]
    test:
      targets: [MIRASCaptureTests]
